description: 'Fiber photometric and single-unit electrophysiological recording data
  from the thalamic nucleus reuniens in male and female Long-Evans rats. Recordings
  spanned multiple days, including habituation, auditory fear conditioning, conditioning
  context extinction and retrieval, and cued extinction and retrieval. This Dandiset
  contains raw recordings. For processed data underlying each figure panel in the
  paper, please refer to: https://static-content.springer.com/esm/art%3A10.1038%2Fs42003-025-08580-0/MediaObjects/42003_2025_8580_MOESM3_ESM.xlsx.'
